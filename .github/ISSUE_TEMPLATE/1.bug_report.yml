name: Bug report
description: Something in variant isn't working the way it should.
title: "[bug] "
labels: ["bug", "triage"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Before opening a new issue, please [search existing issues](https://github.com/saintparish4/variant/issues) — upvoting a duplicate is faster than filing a new report.

        **Feature requests and ideas** → [open a discussion](https://github.com/saintparish4/variant/discussions/new?category=ideas)
        **Documentation issues** → [open a discussion](https://github.com/saintparish4/variant/discussions/new?category=ideas)

        A minimal reproduction is the single most important thing you can do to get your bug fixed quickly.

  - type: input
    id: repro-link
    attributes:
      label: Link to a minimal reproduction
      description: |
        A link to a **public** GitHub repository containing the smallest workspace that demonstrates the issue — typically a minimal monorepo with an `variant.config.ts` and only the packages needed to trigger the bug. Include only the changes that contribute to the issue.

        **Skipping this or providing a link that does not reproduce the issue will result in the issue being closed.**
      placeholder: "https://github.com/you/link-bug-repro"
    validations:
      required: true

  - type: textarea
    id: repro-steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step commands that reproduce the issue against your linked reproduction.
      placeholder: |
        1. Clone the repo and run `pnpm install`
        2. Run `variant run build`
        3. Observe the error / unexpected output
    validations:
      required: true

  - type: textarea
    id: expected-vs-actual
    attributes:
      label: Current vs. expected behavior
      description: |
        Describe what actually happened and what you expected instead. Include error messages, relevant log output, or screenshots.

        **Incomplete descriptions will result in the issue being closed.**
      placeholder: |
        I expected only the two changed packages to be rebuilt, but all 12 packages ran — the git-diff scope filter does not appear to be applied.
    validations:
      required: true

  - type: textarea
    id: env-info
    attributes:
      label: Environment
      description: |
        Fill in the values below. Run `node --version`, `pnpm --version` (or your package manager), and check your `package.json` for the installed variant version.
      render: bash
      placeholder: |
        variant:    1.0.1
        Node.js:          v20.11.0
        Package manager:  pnpm 9.12.0
        OS:               Linux x64 (Ubuntu 22.04)
        Framework:        Next.js 15.0.0
        Workspace:        monorepo (6 packages)
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area(s) are affected? (select all that apply)
      multiple: true
      options:
        - "Not sure"
        - "Config loading (variant.config.ts)"
        - "Task DAG / ordering"
        - "Concurrency / execution"
        - "Caching"
        - "Git-diff scoping / package scopes"
        - "Workspace / package detection"
        - "Framework adapter — Next.js"
        - "Framework adapter — Vite"
        - "Tracer plugin (webpack / Vite)"
        - "Semantic diff (AST classifier)"
        - "CLI / commands"
        - "TypeScript types / public API"
        - "Performance"
    validations:
      required: true

  - type: dropdown
    id: command
    attributes:
      label: Which command or stage is affected? (select all that apply)
      multiple: true
      options:
        - "variant run <task>"
        - "variant build"
        - "Tracer plugin — Next.js (webpack)"
        - "Tracer plugin — Vite"
        - "Config load / validation"
        - "Other / not command-specific"
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        **Narrowing down the regression:** If this worked in an earlier release, it helps us enormously if you can identify which version introduced the bug. Check the [releases page](https://github.com/saintparish4/variant/releases) and install an older version with `pnpm add -D vrnt@<version>` to bisect. Include your findings in "Additional context" below.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack traces
      description: Paste the full terminal output, including any stack traces. If the output is long, attach it as a file or use a gist.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: |
        Anything else that helps: workarounds you tried, whether the issue is intermittent, CI vs. local differences, which version first introduced the regression, etc.
